name: "Game Design"
description: "Create distinctive, beautiful games with satisfying play and sustained player appeal"
version: "2.4.0"
author: "Original Idea App"
created_date: "2024-01-15"

metadata:
  item_type: "game designs"

requirements:
  - "Design a game players would be eager to keep playing: a satisfying core loop, meaningful choices, and room for the experience to deepen. Originality and artistic form should strengthen that appeal; explain how the player can understand and enjoy the unusual rules."
  - "Make the central idea change what the player does, notices or decides. A new setting, title or cosmetic twist alone is not enough."
  - "Treat visual language, sound, rhythm, narrative and interface as potential parts of the rules and meaning, not an optional decorative skin."
  - "Describe concrete actions, feedback and consequences, including a short moment of play and why the next few minutes remain interesting."
  - "Pursue coherent, engaging play on the design's own terms. Conventional scores, levels and win/lose conditions are optional."
  - "Find the smallest playable experiment that tests the central experience. Judge scope by coherence and purposeful systems."
  - "A browser is the intended first delivery medium. Choose implementation tools after the design."
  - "Implementation planning can happen later with a capable coding model. Implementation difficulty is a planning consideration rather than the creative objective."
  - "Ambition does not require a large game. A small, elegant game with a powerful interaction is as welcome as a richer systemic design."
  - "Be specific about any behavior the game depends on: name the player input, state change and observable result. Technology labels are not substitutes for game rules."
  - "Name the riskiest design assumption and a way to test it. Avoid vast feature lists, unexplained magic systems and claims that the game is novel merely because it combines genres."
  - "Omit source code, architecture plans, and long implementation inventories."

output:
  title: "A distinctive game title."
  content: |
    Use these markdown sections:
    - Experience: What makes this worth playing and returning to.
    - How It Plays: The player's actions, rules and consequences, with a short concrete moment of play and how choices or understanding develop.
    - Form: How presentation and interaction contribute to the experience.
    - Distinctiveness: The meaningful departure from familiar territory. References are optional.
    - Playable Test: The first slice that tests the central idea, including whether players understand their choices and want to keep playing.
    Use useful mechanical detail rather than repeated adjectives.
  word_count:
    min: 600
    max: 900

prompts:
  context: |
    Generate 36 independent seeds for original, compelling games with artistic intent.
    Invent the directions yourself. Seek variety in the underlying interaction, player role, structure and experience; do not repeat one idea with different themes.
    Each seed should suggest a concrete player action and a consequence that could sustain enjoyable play. A familiar game can be an influence but is not a required starting point.
    Keep each seed self-contained and brief. Avoid cosmetic novelty and vague promises without a playable relationship.

    Output one seed per line, without commas, using:
    Action=<what the player does> | Response=<what changes> | Experience=<why this could be compelling>

    Return as:
    CONCEPTS:
    - <seed 1>
    - <seed 2>
    - ...

  specific_prompt: |
    Turn the following seeds into one focused creative game-design request:

    {context_pool}

    Treat the supplied concepts as separate ingredients, which may describe game type, perspective, style, subject or mechanics. Choose a compatible subset, keeping useful broad traits as well as distinctive mechanics.
    Develop one promising experiential thread from those ingredients. Leave room for a new design instead of reconstructing a parent or accumulating unrelated features.
    State the player's role, a distinctive action, its consequence and the intended pleasure, tension or discovery.
    Develop the most promising relationship into satisfying play with meaningful choices and room to deepen. Preserve clarity and inventiveness.
    Leave space for the designer to discover the full rules and artistic form. Do not prescribe an engine, line count or feature list.

    Return a concise design request of 2-4 sentences, with no introductory commentary.

  format: |
    Preserve the original title and full markdown design document, including specific rules, player appeal, moment of play, artistic intent, and playable test. Do not add implementation restrictions or invent missing content.

    Input to format:
    {input_text}

  critique: |
    You are a discerning game designer reviewing an original game concept for player appeal and coherence.

    Current idea:
    {idea}

    Evaluate:
    - Whether the core actions are satisfying and the next few minutes offer engaging choices, learning or development. What makes the player want to continue?
    - The clarity of agency, feedback and consequences. Identify missing rules, a dominant boring strategy or an interesting decision that never actually occurs.
    - Whether the design develops its strongest idea or dilutes it with unrelated features. A purposeful complex system is not a flaw by itself.
    - How art, sound, interface and mechanics reinforce the experience. Do unusual rules remain readable and support enjoyment, expression or mastery?
    - Whether originality produces compelling play. An evocative vignette, metaphor or awkward interaction needs demonstrated player value.
    - The most uncertain design assumption and the smallest playtest that could test understanding, enjoyable choices and the desire to continue.

    Give specific criticism and one promising development direction. Preserve unusual ideas worth testing. Judge each design on its intended experience; implementation difficulty is not the primary criterion.
    Return only the critique.

  refine: |
    Current idea:
    {idea}

    Critique:
    {critique}

    Produce a stronger game design. Strengthen its satisfying core loop and sustained player appeal, resolve unclear rules and make its artistic form participate in play.
    Keep the surprising elements that are supported by a concrete experience. Remove or replace systems that weaken that experience rather than reducing ambition by default.
    A substantial rethinking is welcome if it produces a more coherent and interesting game. Include a revised moment of play and a focused playable test.

  breed: |
    Parent designs:
    {ideas}

    Invent a new game from the supplied ingredients, including useful game types, perspectives, styles, subjects and mechanics.
    Recombine a compatible subset into one coherent experience with stronger player appeal. Supply new details and relationships; the ingredients are not a blueprint for reconstructing a parent.

  genotype_encode: |
    For games, consider genre, perspective, dimensionality, player arrangement, theme, tone and visual style, alongside the main activities and defining mechanics.
    Illustration only: "a 2D side-scrolling platform game starring cartoon animals" separates into "2D; side-scrolling; platforming; cartoon animals".

    Game design to encode:
    {idea_content}

  oracle_constraints: |
    Search for missing player experiences and artistic relationships.
    Identify repeated actions, decision structures, sensory forms and player roles across the history. Find a gap that could support a genuinely different kind of play.
    Propose one coherent direction with a satisfying player action, readable causal consequence and a reason to keep playing as the experience develops. Develop it beyond a random remix.
    Browser delivery is a later implementation consideration. Favor a strong, coherent experience over ease of implementation.
    Keep the direction playable and specific; an evocative premise alone is not a game.

comparison_criteria:
  - demonstrated player appeal from a satisfying core loop, meaningful choices and an experience that deepens; why the next few minutes are worth playing
  - clarity and internal consistency of agency, feedback and consequences; readable rules that support learning, discovery, mastery or expression without a dominant boring strategy
  - "artistic coherence: how sensory form, interface, narrative and mechanics reinforce the game's experience or meaning"
  - meaningful originality that strengthens compelling play; a vivid vignette, metaphor, cosmetic reskin or arbitrary modifier alone is insufficient
  - coherence of scope and strength of the first playable experiment; test whether choices are understandable and enjoyable and players want to continue, rather than rewarding polished prose, feature count or the easiest implementation
