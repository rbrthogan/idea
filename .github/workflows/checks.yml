name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - run: uv sync --locked --python 3.11
      - run: uv run --no-sync python scripts/check_release.py --index
      - run: uv run --no-sync pytest -q --strict-markers
      - run: uv export --quiet --frozen --no-dev --no-emit-project --no-header --output-file /tmp/requirements.txt && diff requirements.txt /tmp/requirements.txt
